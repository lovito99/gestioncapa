name: Calidad

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trazabilidad:
    name: Clave Jira
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validar clave en la rama o el título
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'JS'
          const { PR_TITLE: prTitle, PR_BRANCH: prBranch } = process.env;
          const jiraKey = /\b[A-Z][A-Z0-9]*-[1-9][0-9]*\b/;
          if (![prTitle, prBranch].some(value => jiraKey.test(value ?? ''))) {
            console.error('El título o la rama debe incluir una clave Jira, por ejemplo SCRUM-123.');
            process.exitCode = 1;
          }
          JS

  # CAL-01: tipos, build y pruebas unitarias. Verificación obligatoria para integrar.
  calidad:
    name: Tipos, build y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # No se versionan lockfiles; desactivar también la caché automática.
          package-manager-cache: false
      - name: Instalar dependencias
        run: npm install --include=dev --include=optional --package-lock=false
      - name: Revisar tipos
        run: npm run typecheck
      - name: Compilar
        run: npm run build
      - name: Pruebas unitarias (backend y frontend)
        run: npm test

  # AMB-01..03: reproduce los pasos del README de un integrante nuevo.
  entorno:
    name: Entorno con Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # No se versionan lockfiles; desactivar también la caché automática.
          package-manager-cache: false
      - name: Instalar dependencias
        run: npm install --include=dev --include=optional --package-lock=false
      - name: Levantar PostgreSQL 17 y Redis 8
        run: docker compose up -d --wait
      - name: Comprobar versiones
        run: |
          docker exec gestioncapa-postgres psql -U gestiondecapacitacion -tAc "show server_version" | grep '^17\.'
          docker exec gestioncapa-redis redis-server --version | grep 'v=8\.'
      - name: Generar backend/.env
        run: npm run env:init
      - name: Migrar y sembrar usuarios (dos veces, idempotente)
        run: |
          npm run migrate
          npm run seed
          npm run seed
      - name: Pruebas de integración del seed
        run: npm run test:integracion
      - name: Cobertura de asistencia (mínimo 60 %)
        run: npm run test:cobertura
      - name: Registros de servicios
        if: failure()
        run: docker compose logs
